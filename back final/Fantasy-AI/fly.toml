# fly.toml app configuration file for fantasy-ai
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Build context is the repo root (this file's directory); the actual
# backend lives at "back final/Fantasy-AI/" — see ../Dockerfile, which
# is written to account for that.

app = 'fantasy-ai'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Non-secret defaults. Secrets belong in `fly secrets set`, never here.
[env]
  FANTASY_AI_ENV = 'production'
  FANTASY_AI_AUTH_DB_PATH = '/data/auth.db'

[mounts]
  source = 'fantasy_ai_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # NOTE: GET / always returns HTTP 200, even when the model/dataset
  # failed to load at startup (it reports {"status": "not_ready"} in
  # the body instead) — this is an intentional, tested app design
  # (liveness, not readiness). This check therefore confirms the
  # process is alive and serving, not that predictions are usable.
  # Monitor the "status" field in the response body separately if you
  # need true readiness alerting.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
